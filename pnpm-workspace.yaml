packages:
  - apps/*
  - packages/*
verifyDepsBeforeRun: false
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  # core-js es dependencia transitiva de qrcode (usado en Formularios para el QR de cada
  # formulario) — su script de postinstall no hace falta para que funcione, se deja bloqueado.
  core-js: false
