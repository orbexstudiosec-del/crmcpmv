# Instalación completa en un servidor: CRM (web + API), base de datos y Caddy con HTTPS
# automático. WhatsApp va solo por la API oficial de Meta (no hay servicio de WhatsApp QR).
# No se levanta a mano: `./install.sh` genera el .env (nombre del CRM, dominio, claves) y
# ejecuta `docker compose up -d --build`.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD (ejecuta ./install.sh)}
      POSTGRES_DB: crm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crm -d crm']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://crm:${POSTGRES_PASSWORD}@postgres:5432/crm?schema=public
      API_PORT: '4000'
      # De la zona horaria dependen los cortes de "hoy" del servidor (tareas del día, reportes).
      TZ: ${TZ:-America/Guayaquil}
    volumes:
      # Archivos subidos: sin el volumen se perderían al reconstruir la imagen.
      - uploads:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/api/health']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    expose:
      - '4000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      # Nombre por defecto mientras el API no responde; el definitivo se lee del API.
      APP_NAME: ${APP_NAME:-CPMV CRM}
      API_INTERNAL_URL: http://api:4000
      TZ: ${TZ:-America/Guayaquil}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - '3000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # Dominio (HTTPS automático con Let's Encrypt) o ":80" para servir por IP sin HTTPS.
      SITE_ADDRESS: ${SITE_ADDRESS:?Falta SITE_ADDRESS (ejecuta ./install.sh)}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
      - api

volumes:
  pgdata:
  caddydata:
  caddyconfig:
  uploads:
